services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard -d whiteboard"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://whiteboard:whiteboard@db:5432/whiteboard
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      # The browser always talks to Vite (same origin, so the session cookie
      # just works); Vite proxies /api and /ws to the server container.
      API_PROXY_TARGET: http://server:3001
    depends_on:
      - server

volumes:
  pgdata:
